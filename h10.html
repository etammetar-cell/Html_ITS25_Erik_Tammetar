<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Harjutus 10 – Registreerimisvorm</title>
</head>
<body>
<form action="/submit_page" method="get">
  <fieldset>
    <legend>Isikuandmed</legend>

    <p>
      <label for="eesnimi">Eesnimi</label><br>
      <input
        id="eesnimi"
        name="eesnimi"
        type="text"
        placeholder="nt Mario"
        maxlength="30"
        required
      >
    </p>

    <p>
      <label for="perenimi">Perenimi</label><br>
      <input
        id="perenimi"
        name="perenimi"
        type="text"
        placeholder="nt Metshein"
        maxlength="30"
        required
      >
    </p>

    <p>
      <label for="synnikuupaev">Sünnikuupäev</label><br>
      <input
        id="synnikuupaev"
        name="synnikuupaev"
        type="date"
        min="1950-01-01"
        max="2025-12-31"
        value="1980-01-01"
        required
      >
    </p>

    <p>
      <label>Sugu</label><br>
      <input type="radio" id="naine" name="sugu" value="naine">
      <label for="naine">Naine</label>

      <input type="radio" id="mees" name="sugu" value="mees">
      <label for="mees">Mees</label>

      <input type="radio" id="muu" name="sugu" value="muu">
      <label for="muu">Muu</label>
    </p>

    <button type="submit">Registreeru</button>
  </fieldset>
</form>
<fieldset>
  <legend>Kontakt</legend>

  <p>
    <label for="email">E-post</label><br>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="nt nimi@kool.ee"
      maxlength="100"
      required
    ><br>
  </p>

  <p>
    <label for="telefon">Mobiiltelefon</label><br>
    <input
      id="telefon"
      name="telefon"
      type="tel"
      placeholder="+372 51234567"
      pattern="^\+372\s?\d{7,8}$"
      required
    ><br>
  </p>

  <p>
    <label for="aadress">Aadress</label><br>
    <textarea id="aadress" name="aadress" rows="4" cols="40" placeholder="Tänav, maja, korter"></textarea>
  </p>

  <p>
    <label for="linn">Linn / asula</label><br>
    <input
      id="linn"
      name="linn"
      type="text"
      placeholder="nt Tallinn"
      maxlength="30"
      required
    ><br>
  </p>

  <p>
    <label for="postiindeks">Postiindeks</label><br>
    <input
      id="postiindeks"
      name="postiindeks"
      type="text"
      placeholder="nt 10111"
      pattern="^\d{5}$"
      required
    ><br>
    <small>(täpselt 5 numbrit; muster: <code>^\d{5}$</code>)</small>
  </p>

  <p>
    <label for="riik">Riik</label><br>
    <input id="riik" name="riik" type="text" value="Eesti" readonly><br>
  </p>
</fieldset>

<fieldset>
  <legend>Muu info</legend>

  <p>
    <label>Huvialad</label><br>

    <input type="checkbox" id="h_joon" name="huvid[]" value="joonistamine">
    <label for="h_joon">Joonistamine</label>

    <input type="checkbox" id="h_laul" name="huvid[]" value="laulmine">
    <label for="h_laul">Laulmine</label>

    <input type="checkbox" id="h_tants" name="huvid[]" value="tantsimine">
    <label for="h_tants">Tantsimine</label>

    <input type="checkbox" id="h_kokk" name="huvid[]" value="kokkamine">
    <label for="h_kokk">Kokkamine</label>
    <br><br>

    <input type="checkbox" id="h_muu" name="huvid[]" value="muu">
    <label for="h_muu">Muu:</label>
    <input
      id="h_muu_tekst"
      name="huvi_muu_tekst"
      type="text"
      placeholder="täpsusta (kuni 30 märki)"
      maxlength="30"
    >
  </p>

  <p>
    <label for="veeb">Isiklik veebileht</label><br>
    <input
      id="veeb"
      name="veeb"
      type="url"
      placeholder="https://minuleht.ee"
      pattern="https?://.*"
    ><br>
  </p>

  <p>
    <label for="varv">Eelistatud teemavärv (valikuline)</label><br>
    <input id="varv" name="varv" type="color" value="#0b57d0">
  </p>

  <p>
    <label for="dokumendid">Dokumendid (PDF või pilt)</label><br>
    <input
      id="dokumendid"
      name="dokumendid"
      type="file"
      accept=".pdf,image/*"
    ><br>
  </p>
</fieldset>

<fieldset>
  <legend>Nõustumine</legend>

  <p>
    <input id="noustun" name="noustun" type="checkbox" required>
    <label for="noustun">
      Kinnitan, et esitatud andmed on õiged ja luban nende töötlemist vastavalt kooli tingimustele.
    </label>
  </p>
</fieldset>

<p>
  <button type="submit">Saada</button>
  <button type="reset">Tühjenda</button>
</p>
</form>

</body>
</html>
