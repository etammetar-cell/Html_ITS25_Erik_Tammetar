<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML & Bootstrap harjutused</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#071a2b;
      --bg2:#0b2b46;
      --card:#0f3558;
      --card2:#0e2f4d;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --accent:#e85d5d;  /* punakas */
      --accent2:#6fb7ff; /* sinakas */
    }

    body{
      min-height: 100vh;
      background: radial-gradient(900px 600px at 20% 10%, rgba(111,183,255,.20), transparent 55%),
                  radial-gradient(900px 600px at 85% 30%, rgba(232,93,93,.18), transparent 55%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .hero{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 32px 28px;
    }

    .hero h1{
      font-weight: 600;
      letter-spacing: .5px;
    }

    .section-title{
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .6px;
      margin-bottom: 14px;
    }

    .tile{
      display: flex;
      align-items: center;
      justify-content: center;
      height: 140px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }

    .tile:hover{
      transform: translateY(-2px);
      border-color: rgba(111,183,255,.35);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      color: var(--text);
    }

    .tile .badge{
      position: absolute;
      top: 10px;
      right: 10px;
      font-weight: 600;
      background: rgba(232,93,93,.18);
      border: 1px solid rgba(232,93,93,.40);
      color: var(--text);
    }

    .tile-wrap{
      position: relative;
    }

    .subnote{
      color: var(--muted);
      font-size: .95rem;
    }

    footer{
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="container py-5">

    <div class="hero text-center mb-4">
      <h1 class="display-5 mb-2">HTML & Bootstrap harjutused</h1>
      <div class="subnote">ITS25 — Erik Tammetar</div>
    </div>

    <div class="row g-4">
      <!-- HTML -->
      <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-end">
          <div class="section-title">HTML</div>
        </div>

        <div class="row g-3">
          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h02.html">Harjutus 2</a>
          </div>

          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h03.html">Harjutus 3</a>
          </div>

          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h04.html">Harjutus 4</a>
          </div>

          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h05/">
              Harjutus 5
            </a>
          </div>

          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h06.html">Harjutus 6</a>
          </div>

          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h08.html">Harjutus 8</a>
          </div>

          <div class="col-6 col-md-4 tile-wrap">
            <a class="tile" href="./h10.html">
              Harjutus 10
            </a>
            <span class="badge rounded-pill">Vormid</span>
          </div>
        </div>
      </div>

      <!-- Bootstrap -->
      <div class="col-lg-5">
        <div class="d-flex justify-content-between align-items-end">
          <div class="section-title">Bootstrap</div>
        </div>

        <div class="row g-3">
          <div class="col-6 tile-wrap">
            <a class="tile" href="./BS/bs01.html">Harjutus 1</a>
          </div>

          <div class="col-6 tile-wrap">
            <a class="tile" href="./BS/bs02.html">Harjutus 2</a>
          </div>

          <div class="col-6 tile-wrap">
            <a class="tile" href="./BS/bs03.html">Harjutus 3</a>
          </div>

          <div class="col-6 tile-wrap">
            <a class="tile" href="./BS/bs04.html">Harjutus 4</a>
          </div>
        </div>
      </div>
    </div>

    <footer class="mt-5 text-center">
      <small>GitHub Pages — main / root</small>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
